server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed build assets: filename changes whenever content changes, so it
    # is safe to cache these forever. A request for a chunk that no longer
    # exists (e.g. an old tab after a fresh deploy) must 404, NOT fall back
    # to index.html — a 200 of HTML for a JS request breaks the module
    # loader's MIME check and is undiagnosable from a 200 status alone.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Self-hosted fonts. Unlike /assets/ these filenames are NOT content-hashed,
    # so caching them for a year is a promise that the bytes never change: if the
    # font is ever replaced, give the new file a different name rather than
    # editing this one in place. Without this block /fonts/ falls through to the
    # catch-all below and inherits `no-cache`, which would make the browser
    # revalidate the font on every single load -- most of the point of not using
    # a CDN is lost if the file is re-fetched anyway.
    location /fonts/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # index.html (served directly or via the SPA fallback above) names
        # the current chunk hashes, so it must always be revalidated rather
        # than served stale from the browser's heuristic cache.
        add_header Cache-Control "no-cache";
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
