services:
  db:
    image: timescale/timescaledb:latest-pg14
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    volumes:
      - netguard_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - netguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - netguard-net
    restart: unless-stopped

  backend:
    build: ./backend
    command: >
      sh -c "
        ip route add 10.13.13.0/24 via 172.25.0.100 || true &&
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend:/app
      - ./wireguard-config:/etc/wireguard
    cap_add:
      - NET_ADMIN
    env_file:
      - .env.production
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER:-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-netguard}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - netguard-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netguard-net
    restart: unless-stopped

  monitor-agent:
    build: ./agents
    command: >
      sh -c 'sleep 5;
      ls -l;
      echo "Adding VPN Route to Static IP...";
      WG_IP="172.25.0.100";
      echo "WireGuard IP: $$WG_IP";
      ip route add 10.13.13.0/24 via $$WG_IP;
      ip route show;
      python monitor_agent.py'
    volumes:
      - ./agents:/app
    cap_add:
      - NET_ADMIN
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=agent-secret-key-123
      - PYTHONUNBUFFERED=1
      - SSH_USER=${SSH_USER:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin}
    depends_on:
      backend:
        condition: service_healthy
      wireguard:
        condition: service_started
    networks:
      - netguard-net
    restart: unless-stopped

  # Background voucher generation worker (Task 3). Consumes the
  # hotspot:voucher_jobs Redis list that POST /{device_id}/users/batch
  # enqueues (Task 2) so voucher creation survives the operator leaving the
  # page. Deliberately its own service rather than folded into monitor-agent:
  # a 500-voucher job is ~90s of blocking router work and would stall the
  # metric collection monitor-agent exists for. environment/networks/cap_add/
  # depends_on are copied from monitor-agent verbatim -- same VPN route, same
  # backend credentials, same Redis.
  voucher-worker:
    build: ./agents
    command: >
      sh -c '
      ip route add 10.13.13.0/24 via 172.25.0.100 || true;
      python voucher_job_worker.py'
    volumes:
      - ./agents:/app
    cap_add:
      - NET_ADMIN
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=agent-secret-key-123
      - PYTHONUNBUFFERED=1
      - SSH_USER=${SSH_USER:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin}
    depends_on:
      backend:
        condition: service_healthy
      wireguard:
        condition: service_started
    networks:
      - netguard-net
    restart: unless-stopped

  diagnoser-agent:
    build: ./agents
    command: python diagnoser_agent.py
    volumes:
      - ./agents:/app
    env_file:
      - .env.production
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=${NETGUARD_API_KEY:-agent-secret-key-123}
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netguard-net
    restart: unless-stopped

  classic-fix-agent:
    build: ./agents
    command: >
      sh -c 'sleep 5;
      ip route add 10.13.13.0/24 via 172.25.0.100 || true;
      python fix_agent.py'
    volumes:
      - ./agents:/app
    cap_add:
      - NET_ADMIN
    env_file:
      - .env.production
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=${NETGUARD_API_KEY:-agent-secret-key-123}
      - PYTHONUNBUFFERED=1
      - SSH_USER=${SSH_USER:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin}
    depends_on:
      backend:
        condition: service_healthy
      wireguard:
        condition: service_started
    networks:
      - netguard-net
    restart: unless-stopped

  ai-fix-agent:
    build: ./agents
    command: python ai_fix_agent.py
    volumes:
      - ./agents:/app
    env_file:
      - .env.production
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=${NETGUARD_API_KEY:-agent-secret-key-123}
      - PYTHONUNBUFFERED=1
      - SSH_USER=${SSH_USER:-admin}
      - SSH_PASSWORD=${SSH_PASSWORD:-admin}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netguard-net
    restart: unless-stopped

  reporter-agent:
    build: ./agents
    command: python reporter_agent.py
    volumes:
      - ./agents:/app
    env_file:
      - .env.production
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=${NETGUARD_API_KEY:-agent-secret-key-123}
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netguard-net
    restart: unless-stopped

  wg-agent:
    build: ./agents
    command: >
      sh -c 'sleep 5;
      ip route add 10.13.13.0/24 via 172.25.0.100 || true;
      python wg_agent.py'
    volumes:
      - ./agents:/app
    cap_add:
      - NET_ADMIN
    env_file:
      - .env.production
    environment:
      - API_URL=http://backend:8000/api/v1
      - NETGUARD_API_KEY=${NETGUARD_API_KEY:-agent-secret-key-123}
      - PYTHONUNBUFFERED=1
      - WG_CHECK_INTERVAL=30
      - WG_FAIL_THRESHOLD=3
    depends_on:
      backend:
        condition: service_healthy
      wireguard:
        condition: service_started
    networks:
      - netguard-net
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - netguard-net
    restart: unless-stopped

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: netguard-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
      - TZ=Etc/UTC
      - SERVERURL=74.208.167.166 # Public IP of VPS
      - SERVERPORT=51820
      - SERVERPORT=51820
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      netguard-net:
        ipv4_address: 172.25.0.100

  # Loads peers the backend writes into the running wg0 interface.
  #
  # The backend can only append to the config file: wg0 lives in the wireguard
  # container's network namespace and no container here has the docker socket,
  # so nothing could reload it. Peers stayed inert until that container next
  # restarted, which meant a newly provisioned router could never handshake and
  # nothing reported a failure. See scripts/wg-reloader.sh.
  #
  # network_mode puts this in wireguard's namespace, the only place `wg
  # syncconf` can see wg0. That also means it takes no network or ports of its
  # own, so it cannot be addressed from outside.
  wg-reloader:
    image: alpine:3.20
    container_name: netguard-wg-reloader
    network_mode: "service:wireguard"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./wireguard-config:/config
      - ./scripts/wg-reloader.sh:/wg-reloader.sh:ro
    command: ["sh", "/wg-reloader.sh"]
    environment:
      - WG_RELOAD_POLL=10
    restart: unless-stopped
    depends_on:
      wireguard:
        condition: service_started

volumes:
  netguard_data:
  caddy_data:
  caddy_config:

networks:
  netguard-net:
    ipam:
      config:
        - subnet: 172.25.0.0/16
